name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d taskdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/taskdb?schema=public
      JWT_SECRET: ci-only-test-secret
      JWT_EXPIRES_IN: 15m
      PORT: 3001
      MAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ''
      SMTP_PASS: ''
      MAIL_FROM: Task App <no-reply@taskapp.local>

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Run Jest unit tests
        run: npm run test:unit

      - name: Run Supertest e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
